nodes:
  Application:
    properties:
      id:
        type: string
        required: true
        unique: true
      name:
        type: string
        required: true

  ApiKey:
    properties:
      id:
        type: string
        required: true
        unique: true
      name:
        type: string
        required: true
      email:
        type: string
        required: true
      api_key_hash:
        type: string
        required: true
        unique: true
      is_active:
        type: boolean
        required: true
      created_at:
        type: datetime
        required: true
    relationships:
      BOUND_TO:
        target: Application
        cardinality: one
        required: false

  Work:
    properties:
      id:
        type: string
        required: true
        unique: true
      wiki:
        type: string
        required: false
        unique: true
      bdrc:
        type: string
        required: false
        unique: true
    relationships:
      HAS_CATEGORY:
        target: Category
        cardinality: one
        required: true
      HAS_TAG:
        target: Tag
        cardinality: many
        required: false

  Tag:
    properties:
      id:
        type: string
        required: true
        unique: true
    relationships:
      BELONGS_TO:
        target: Application
        cardinality: one
        required: true
      HAS_TITLE:
        target: Nomen
        cardinality: one
        required: true
      HAS_DESCRIPTION:
        target: Nomen
        cardinality: one
        required: false

  Category:
    properties:
      id:
        type: string
        required: true
        unique: true
    relationships:
      BELONGS_TO:
        target: Application
        cardinality: one
        required: true
      HAS_TITLE:
        target: Nomen
        cardinality: one
        required: true
      HAS_DESCRIPTION:
        target: Nomen
        cardinality: one
        required: false
      HAS_PARENT:
        target: Category
        cardinality: one
        required: false

  Text:
    properties:
      id:
        type: string
        required: true
        unique: true
      wiki:
        type: string
        required: false
        unique: true
      bdrc:
        type: string
        required: false
        unique: true
      date:
        type: string
        required: false
    relationships:
      TEXT_OF:
        target: Work
        cardinality: one
        required: true
        properties:
          original:
            type: boolean
            required: true
      TRANSLATION_OF:
        target: Text
        cardinality: one
        required: false
      COMMENTARY_OF:
        target: Text
        cardinality: one
        required: false
      HAS_LANGUAGE:
        target: Language
        cardinality: one
        required: true
        properties:
          bcp47:
            type: string
            required: false
      HAS_CONTRIBUTION:
        target: Contribution
        cardinality: many
        required: false
      HAS_TITLE:
        target: Nomen
        cardinality: one
        required: true
      HAS_LICENSE:
        target: LicenseType
        cardinality: one
        required: true

  Edition:
    properties:
      id:
        type: string
        required: true
        unique: true
      content_length:
        type: integer
        required: true
      content_key:
        type: string
        required: true
      revision:
        type: integer
        required: true
      colophon:
        type: string
        required: false
      bdrc:
        type: string
        required: false
        unique: true
      wiki:
        type: string
        required: false
        unique: true
    relationships:
      HAS_TYPE:
        target: EditionType
        cardinality: one
        required: true
      HAS_INCIPIT_TITLE:
        target: Nomen
        cardinality: one
        required: false
      EDITION_OF:
        target: Text
        cardinality: one
        required: true
      HAS_SOURCE:
        target: Source
        cardinality: one
        required: false
      HAS_SEGMENTATION:
        target: Segmentation
        cardinality: one
        required: false

  Recording:
    properties:
      id:
        type: string
        required: true
        unique: true
      format:
        type: string
        required: true
        allowed_values:
          - mp3
          - wav
          - m4a
          - ogg
          - flac
      size_bytes:
        type: integer
        required: true
      duration_ms:
        type: integer
        required: false
      date:
        type: string
        required: false
    relationships:
      RECORDING_OF:
        target: Edition
        cardinality: one
        required: true
      HAS_TITLE:
        target: Nomen
        cardinality: one
        required: false
      HAS_LANGUAGE:
        target: Language
        cardinality: one
        required: false
        properties:
          bcp47:
            type: string
            required: false
      HAS_LICENSE:
        target: LicenseType
        cardinality: one
        required: true
      HAS_CONTRIBUTION:
        target: Contribution
        cardinality: many
        required: true

  Cue:
    properties:
      start_ms:
        type: integer
        required: true
      end_ms:
        type: integer
        required: true
    relationships:
      CUE_OF:
        target: Recording
        cardinality: one
        required: true

  Source:
    properties:
      name:
        type: string
        required: true

  Segmentation:
    properties:
      id:
        type: string
        required: true
        unique: true
    relationships:
      HAS_METADATA:
        target: AnnotationMetadata
        cardinality: one
        required: false

  Segment:
    properties:
      id:
        type: string
        required: true
        unique: true
      type:
        type: string
        required: true
        allowed_values:
          - paragraph
          - verse
          - title
          - back_matter
          - front_matter
          - top_segment
      reference:
        type: string
        required: false
    relationships:
      SEGMENT_OF:
        target: Segmentation
        cardinality: one
        required: true
      ALIGNED_TO:
        target: Segment
        cardinality: many
        required: false
      HAS_TAG:
        target: Tag
        cardinality: many
        required: false

  Span:
    properties:
      start:
        type: integer
        required: true
      end:
        type: integer
        required: true
    relationships:
      SPAN_OF:
        target: Segment | BibliographicMetadata | Note | Mark | Attribute | Page | TableOfContentsSection | Cue
        cardinality: one
        required: true

  BibliographicMetadata:
    properties:
      id:
        type: string
        required: true
        unique: true
    relationships:
      BIBLIOGRAPHY_OF:
        target: Edition
        cardinality: one
        required: true
      HAS_TYPE:
        target: BibliographyType
        cardinality: one
        required: true
      HAS_METADATA:
        target: AnnotationMetadata
        cardinality: one
        required: false

  Note:
    properties:
      id:
        type: string
        required: true
        unique: true
      text:
        type: string
        required: true
    relationships:
      NOTE_OF:
        target: Edition
        cardinality: one
        required: true
      HAS_TYPE:
        target: NoteType
        cardinality: one
        required: true
      HAS_METADATA:
        target: AnnotationMetadata
        cardinality: one
        required: false

  Mark:
    properties:
      id:
        type: string
        required: true
        unique: true
    relationships:
      MARK_OF:
        target: Edition
        cardinality: one
        required: true
      HAS_TYPE:
        target: MarkType
        cardinality: one
        required: true
      HAS_METADATA:
        target: AnnotationMetadata
        cardinality: one
        required: false

  Attribute:
    properties:
      id:
        type: string
        required: true
        unique: true
      value:
        type: any
        required: true
    relationships:
      ATTRIBUTE_OF:
        target: Edition
        cardinality: one
        required: true
      HAS_TYPE:
        target: AttributeType
        cardinality: one
        required: true
      HAS_METADATA:
        target: AnnotationMetadata
        cardinality: one
        required: false

  Pagination:
    properties:
      id:
        type: string
        required: true
        unique: true
    relationships:
      PAGINATION_OF:
        target: Edition
        cardinality: one
        required: true
      HAS_METADATA:
        target: AnnotationMetadata
        cardinality: one
        required: false

  TableOfContents:
    properties:
      id:
        type: string
        required: true
        unique: true
    relationships:
      TOC_OF:
        target: Edition
        cardinality: one
        required: true
      HAS_METADATA:
        target: AnnotationMetadata
        cardinality: one
        required: false

  TableOfContentsSection:
    properties:
      id:
        type: string
        required: true
        unique: true
    relationships:
      SECTION_OF:
        target: TableOfContents
        cardinality: one
        required: true
      SUBSECTION_OF:
        target: TableOfContentsSection
        cardinality: one
        required: false
      HAS_TITLE:
        target: Nomen
        cardinality: one
        required: true
      HAS_SUMMARY:
        target: Nomen
        cardinality: one
        required: false

  Volume:
    properties:
      id:
        type: string
        required: true
        unique: true
      index:
        type: integer
        required: false
    relationships:
      VOLUME_OF:
        target: Pagination
        cardinality: one
        required: true
      HAS_METADATA:
        target: AnnotationMetadata
        cardinality: one
        required: false

  Page:
    properties:
      id:
        type: string
        required: true
        unique: true
      reference:
        type: string
        required: true
    relationships:
      PAGE_OF:
        target: Volume
        cardinality: one
        required: true

  AnnotationMetadata:
    properties:
      id:
        type: string
        required: true
        unique: true
      name:
        type: string
        required: false

  Contribution:
    relationships:
      BY:
        target: Person | AI
        cardinality: one
        required: true
      WITH_ROLE:
        target: RoleType
        cardinality: one
        required: true

  AI:
    properties:
      id:
        type: string
        required: true
        unique: true

  Person:
    properties:
      id:
        type: string
        required: true
        unique: true
      bdrc:
        type: string
        required: false
        unique: true
      wiki:
        type: string
        required: false
        unique: true
    relationships:
      HAS_NAME:
        target: Nomen
        cardinality: one
        required: true

  Nomen:
    properties:
      id:
        type: string
        required: true
        unique: true
    relationships:
      HAS_LOCALIZATION:
        target: LocalizedText
        cardinality: many
        required: true
      ALTERNATIVE_OF:
        target: Nomen
        cardinality: one
        required: false

  LocalizedText:
    properties:
      text:
        type: string
        required: true
    relationships:
      HAS_LANGUAGE:
        target: Language
        cardinality: one
        required: true
        properties:
          bcp47:
            type: string
            required: false

  Language:
    properties:
      code:
        type: string
        required: true
        unique: true
      name:
        type: string
        required: true

  EditionType:
    enum: true
    properties:
      name:
        type: string
        unique: true
        required: true
        allowed_values:
          - diplomatic
          - critical
          - collated

  LicenseType:
    enum: true
    properties:
      name:
        type: string
        unique: true
        required: true
        allowed_values:
          - cc0
          - public
          - cc-by
          - cc-by-sa
          - cc-by-nd
          - cc-by-nc
          - cc-by-nc-sa
          - cc-by-nc-nd
          - copyrighted
          - unknown

  BibliographyType:
    enum: true
    properties:
      name:
        type: string
        unique: true
        required: true
        allowed_values:
          - colophon
          - incipit
          - alt_incipit
          - alt_title
          - person
          - title
          - author

  NoteType:
    enum: true
    properties:
      name:
        type: string
        unique: true
        required: true
        allowed_values:
          - durchen

  MarkType:
    enum: true
    properties:
      name:
        type: string
        unique: true
        required: true
        allowed_values:
          - yigchung

  AttributeType:
    enum: true
    properties:
      name:
        type: string
        unique: true
        required: true
        allowed_values:
          - ocr_confidence

  RoleType:
    enum: true
    properties:
      name:
        type: string
        unique: true
        required: true
        allowed_values:
          - reviser
          - author
          - translator
          - scholar
          - narrator
